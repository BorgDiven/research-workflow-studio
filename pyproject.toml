[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-workflow-studio"
version = "0.3.2"
description = "Human-guided research workflows with durable records, evidence reuse and controlled MCP tools"
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "BorgDiven"}]
keywords = ["research-workflow", "mcp", "experiment-management", "evidence", "research-tools"]

[project.urls]
Repository = "https://github.com/BorgDiven/research-workflow-studio"
Issues = "https://github.com/BorgDiven/research-workflow-studio/issues"

[project.scripts]
research-workflow-studio = "rws.__main__:main"

[tool.setuptools]
packages = ["rws"]

[tool.setuptools.data-files]
"share/research-workflow-studio/web" = ["web/*.html", "web/*.css", "web/*.js"]
"share/research-workflow-studio/web/assets" = ["web/assets/*"]
"share/research-workflow-studio/web/docs" = ["web/docs/*"]
"share/research-workflow-studio/web/examples" = ["web/examples/*"]
