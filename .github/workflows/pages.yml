name: Public website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/**'
      - 'rws/**'
      - 'tools/build_site.py'
      - 'tools/seed_showcase.py'
      - 'tests/test_public_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: public-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application and isolated demo
        run: |
          python -m unittest discover -s tests
          node --test web/tests/*.test.js
      - name: Build public files from fictional seed data
        run: python tools/build_site.py --output .local/public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .local/public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
